name: V1 Neon Role enable_sort Drift Runtime
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      source_postgres:
        image: postgres:18
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: [55432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      destination_postgres:
        image: postgres:18
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: [55433:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact head
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
      - name: Install PostgreSQL 18 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo ${VERSION_CODENAME})-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      - name: Production script syntax
        run: bash -n scripts/neon-sync/append-sync.sh
      - name: Focused runtime harness syntax
        run: bash -n tests/neon-sync-role-enable-sort-drift-runtime.sh
      - name: Real role enable_sort drift runtime
        id: runtime
        continue-on-error: true
        run: |
          set +e
          bash tests/neon-sync-role-enable-sort-drift-runtime.sh 2>&1 | tee role-enable-sort-drift-runtime.log
          code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$code" > role-enable-sort-drift-runtime.exit
          exit "$code"
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-d-role-enable-sort-drift-evidence
          path: |
            role-enable-sort-drift-runtime.log
            role-enable-sort-drift-runtime.exit
      - name: Confirm runtime reached product verdict
        if: always()
        run: |
          set -euo pipefail
          test -f role-enable-sort-drift-runtime.exit
          test "$(cat role-enable-sort-drift-runtime.exit)" -ne 2
      - name: Confirm production false-success boundary
        if: always()
        run: |
          set -euo pipefail
          grep -Fxq 'NEON_ROLE_ENABLE_SORT_DRIFT_SYNC_EXIT=0' role-enable-sort-drift-runtime.log
          grep -Fxq 'NEON_ROLE_ENABLE_SORT_DRIFT_DETECTED=false' role-enable-sort-drift-runtime.log
      - name: Enforce certification result
        if: always()
        run: |
          set -euo pipefail
          test "$(cat role-enable-sort-drift-runtime.exit)" -eq 0
