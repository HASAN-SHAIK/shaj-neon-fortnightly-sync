name: V1 Neon import failure atomicity runtime

on:
  pull_request:
    paths:
      - "scripts/neon-sync/**"
      - "tests/neon-sync-import-failure-atomicity-runtime.sh"
      - ".github/workflows/v1-neon-import-failure-atomicity-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "NEON_ATOMICITY_TEST_HEAD=$actual"
          echo "NEON_ATOMICITY_EXPECTED_HEAD=$EXPECTED_HEAD"
          test "$actual" = "$EXPECTED_HEAD"

      - name: Install PostgreSQL 18 client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          psql --version
          pg_dump --version

      - name: Smallest relevant automated checks
        run: |
          set -euo pipefail
          bash -n scripts/neon-sync/append-sync.sh
          bash -n tests/neon-sync-import-failure-atomicity-runtime.sh

      - name: Create isolated source and destination databases
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create database shaj_atomicity_source;
          create database shaj_atomicity_destination;
          SQL

          psql -h 127.0.0.1 -U postgres -d shaj_atomicity_source -v ON_ERROR_STOP=1 <<'SQL'
          create table public.products (
            id bigint primary key,
            sku text unique not null,
            name text not null,
            quantity integer not null
          );
          insert into public.products (id, sku, name, quantity) values
            (1, 'SRC-VALID', 'Valid source row', 5),
            (2, 'SRC-REJECT', 'Rejected source row', -7);
          SQL

          psql -h 127.0.0.1 -U postgres -d shaj_atomicity_destination -v ON_ERROR_STOP=1 <<'SQL'
          create table public.products (
            id bigint primary key,
            sku text unique not null,
            name text not null,
            quantity integer not null check (quantity >= 0)
          );
          create table public.product_audit (
            audit_id bigserial primary key,
            sku text not null
          );
          create or replace function public.audit_product_insert() returns trigger language plpgsql as $$
          begin
            insert into public.product_audit (sku) values (new.sku);
            return new;
          end;
          $$;
          create trigger products_audit_trigger
          after insert on public.products
          for each row execute function public.audit_product_insert();
          insert into public.products (id, sku, name, quantity)
          values (100, 'DEST-ONLY', 'Destination baseline', 10);
          SQL

      - name: Run real append sync and verify failed-import atomicity
        env:
          PGPASSWORD: postgres
          SOURCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shaj_atomicity_source
          DESTINATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shaj_atomicity_destination
          EXCLUDED_TABLES: "public.product_audit"
        run: bash tests/neon-sync-import-failure-atomicity-runtime.sh
