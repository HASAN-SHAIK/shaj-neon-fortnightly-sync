name: V1 Neon sequence monotonicity runtime

on:
  pull_request:
    paths:
      - "scripts/neon-sync/**"
      - "tests/neon-sync-sequence-monotonicity-runtime.sh"
      - ".github/workflows/v1-neon-sequence-monotonicity-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "NEON_SEQUENCE_TEST_HEAD=$actual"
          echo "NEON_SEQUENCE_EXPECTED_HEAD=$EXPECTED_HEAD"
          test "$actual" = "$EXPECTED_HEAD"

      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          psql --version
          pg_dump --version

      - name: Smallest relevant automated checks
        run: |
          bash -n scripts/neon-sync/append-sync.sh
          bash -n tests/neon-sync-sequence-monotonicity-runtime.sh

      - name: Create isolated source and destination databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create database shaj_sequence_source;
          create database shaj_sequence_destination;
          SQL

          psql -h 127.0.0.1 -U postgres -d shaj_sequence_source -v ON_ERROR_STOP=1 <<'SQL'
          create table public.products (
            id bigserial primary key,
            sku text unique not null,
            name text not null
          );
          insert into public.products (sku, name) values
            ('SRC-001', 'Source one'),
            ('SRC-002', 'Source two');
          SQL

          psql -h 127.0.0.1 -U postgres -d shaj_sequence_destination -v ON_ERROR_STOP=1 <<'SQL'
          create table public.products (
            id bigserial primary key,
            sku text unique not null,
            name text not null
          );
          insert into public.products (sku, name) values ('SRC-001', 'Destination overlapping row');
          select setval('public.products_id_seq', 99, true);
          insert into public.products (sku, name) values ('DEST-ONLY', 'Destination retained row');
          SQL

      - name: Run real append sync and verify destination sequence monotonicity
        env:
          PGPASSWORD: postgres
          SOURCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shaj_sequence_source
          DESTINATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shaj_sequence_destination
          EXCLUDED_TABLES: ""
        run: bash tests/neon-sync-sequence-monotonicity-runtime.sh
