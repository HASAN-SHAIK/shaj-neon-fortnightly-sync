name: V1 Neon RLS Policy Role Drift Runtime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      source_postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      destination_postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo ${VERSION_CODENAME})-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          /usr/lib/postgresql/18/bin/psql --version
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Production script syntax
        run: bash -n scripts/neon-sync/append-sync.sh

      - name: Focused runtime harness syntax
        run: bash -n tests/neon-sync-rls-policy-role-drift-runtime.sh

      - name: Real RLS policy role drift runtime
        id: runtime
        continue-on-error: true
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set +e
          bash tests/neon-sync-rls-policy-role-drift-runtime.sh 2>&1 | tee rls-policy-role-drift-runtime.log
          code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$code" > rls-policy-role-drift-runtime.exit
          exit "$code"

      - name: Upload RLS policy role drift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-d-rls-policy-role-drift-evidence
          path: |
            rls-policy-role-drift-runtime.log
            rls-policy-role-drift-runtime.exit

      - name: Enforce certification result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code="$(cat rls-policy-role-drift-runtime.exit)"
          test "$code" -eq 0
