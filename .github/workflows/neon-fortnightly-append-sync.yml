name: Neon fortnightly append sync

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 02:00 Asia/Kolkata. A guard step limits real syncs to the
    # 1st and 16th because GitHub Actions cron only supports UTC.
    - cron: "30 20 * * *"

jobs:
  append-sync:
    name: Append source data into mirror
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check sync day
        id: sync-day
        if: github.event_name == 'schedule'
        run: |
          ist_day="$(TZ=Asia/Kolkata date +%d)"
          if [ "$ist_day" != "01" ] && [ "$ist_day" != "16" ]; then
            echo "Today is not a scheduled sync day in Asia/Kolkata."
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_sync=true" >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL client
        if: github.event_name == 'workflow_dispatch' || steps.sync-day.outputs.should_sync == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run append sync
        if: github.event_name == 'workflow_dispatch' || steps.sync-day.outputs.should_sync == 'true'
        env:
          SOURCE_DATABASE_URL: ${{ secrets.NEON_SOURCE_DATABASE_URL }}
          DESTINATION_DATABASE_URL: ${{ secrets.NEON_DESTINATION_DATABASE_URL }}
          EXCLUDED_TABLES: ${{ vars.NEON_SYNC_EXCLUDED_TABLES }}
        run: bash scripts/neon-sync/append-sync.sh
